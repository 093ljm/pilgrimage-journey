[images]
  remote_images = ["https://source.unsplash.com/.*", "https://images.unsplash.com/.*", "https://ext.same-assets.com/.*", "https://ugc.same-assets.com/.*", "https://i.ytimg.com/.*"]

[build]
  command = "bun run build"
  publish = ".next"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# ============================================================
# 快取
# ------------------------------------------------------------
# ★ 「後台改完內容，要重新整理兩次才看到新版」的原因：
#   不是快取，而是「建置時間」。後台按發布 → GitHub 產生 commit →
#   Netlify 重新建置上線，整段大約需要 1~2 分鐘。
#   在建置完成前重新整理，看到的當然還是舊版。
#   實測建置完成後，第一次重新整理就是新內容。
#
#   下面這條只是把帶雜湊值的靜態檔（改了就會換檔名）設為長期快取，
#   讓每次換頁不必重複驗證，網站會更快。頁面本身不快取，維持即時更新。
# ============================================================

[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
