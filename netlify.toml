[images]
  remote_images = ["https://source.unsplash.com/.*", "https://images.unsplash.com/.*", "https://ext.same-assets.com/.*", "https://ugc.same-assets.com/.*", "https://i.ytimg.com/.*"]

[build]
  command = "bun run build"
  publish = ".next"
  # ============================================================
  # 省點數：不影響網站畫面的 commit 不重新建置
  # ★ Netlify 免費方案每月 300 點，每次正式部署扣 15 點（約 20 次就用完）。
  #   以下三種變更不會改變網站內容，因此略過建置：
  #   - .same/（AI 專案筆記）、README.md
  #   - public/images/uploads/（後台媒體庫單獨上傳或刪除照片）
  #     照片被文章引用時，發布文章那次就會一併上線，不會漏掉。
  #   手動按「Trigger deploy」一定會建置；判斷失敗時也一律建置。
  #   規則：exit 0 = 略過，其他 = 建置
  # ============================================================
  ignore = "test \"$CACHED_COMMIT_REF\" != \"$COMMIT_REF\" && git diff --quiet \"$CACHED_COMMIT_REF\" \"$COMMIT_REF\" -- . ':!.same' ':!README.md' ':!public/images/uploads'"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# ============================================================
# 快取
# ------------------------------------------------------------
# ★ 「後台改完內容，要重新整理兩次才看到新版」的原因：
#   不是快取，而是「建置時間」。後台按發布 → GitHub 產生 commit →
#   Netlify 重新建置上線，整段大約需要 1~2 分鐘。
#   在建置完成前重新整理，看到的當然還是舊版。
#   實測建置完成後，第一次重新整理就是新內容。
#
#   下面這條只是把帶雜湊值的靜態檔（改了就會換檔名）設為長期快取，
#   讓每次換頁不必重複驗證，網站會更快。頁面本身不快取，維持即時更新。
# ============================================================

[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
